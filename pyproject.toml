[project]
name = "spotify-mcp"
version = "0.1.0"
description = "A local MCP server that lets Claude Code control your Spotify account."
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "python-dotenv>=1.2.4",
    "spotipy>=2.26",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
